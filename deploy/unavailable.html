<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ecedea">
<title>Back in a moment · Oriel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --plaster: #ecedea; --concrete: #d6d8d3; --graphite: #1a1d1f; --soft: #5a6066; --cobalt: #1f3bd1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--plaster);
    background-image:
      linear-gradient(to right, rgb(26 29 31 / 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(26 29 31 / 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--graphite);
    font: 400 17px/1.55 "Mona Sans", "Helvetica Neue", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: min(100%, 560px); display: grid; gap: 28px; }
  .mark { font-weight: 800; letter-spacing: 0.32em; font-size: 15px; }
  svg { width: 132px; height: auto; display: block; }
  h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; font-weight: 760; }
  p { margin: 0; color: var(--soft); max-width: 44ch; }
  .note { font: 500 12px/1.4 "Martian Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cobalt); border-top: 1px solid var(--concrete); padding-top: 14px; }
  a { color: var(--cobalt); }
</style>
</head>
<body>
<main>

  <svg viewBox="0 0 120 160" fill="none" stroke="#1a1d1f" stroke-width="1.2" aria-hidden="true">

    <path d="M90 104h7v12h-7M90 80h7v12h-7M90 56h7v12h-7M23 92h7v12h-7M23 68h7v12h-7M23 44h7v12h-7" stroke="#1f3bd1"/>
    <path d="M40 20v-8h40v8"/>
  </svg>
  <h1>We'll be back in a moment.</h1>

</body>
</html>
